<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FEE500">
<title>강원랜드 프로젝트 맛집 지도</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23FEE500'/%3E%3Cpath d='M32 10c-9.4 0-17 7.2-17 16.1 0 5.6 3 10.5 7.5 13.4L20 49l10.6-6.4c.5 0 .9.1 1.4.1 9.4 0 17-7.2 17-16.1S41.4 10 32 10z' fill='%233C1E1E'/%3E%3Cpath d='M32 19l2.6 5.6 6.1.8-4.5 4.3 1.1 6.1L32 33l-5.3 2.8 1.1-6.1-4.5-4.3 6.1-.8z' fill='%23FEE500'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23FEE500'/%3E%3Cpath d='M32 10c-9.4 0-17 7.2-17 16.1 0 5.6 3 10.5 7.5 13.4L20 49l10.6-6.4c.5 0 .9.1 1.4.1 9.4 0 17-7.2 17-16.1S41.4 10 32 10z' fill='%233C1E1E'/%3E%3Cpath d='M32 19l2.6 5.6 6.1.8-4.5 4.3 1.1 6.1L32 33l-5.3 2.8 1.1-6.1-4.5-4.3 6.1-.8z' fill='%23FEE500'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<style>
:root{
  --kakao:#FEE500;--kakao-dk:#F5D800;--brown:#3C1E1E;--ink:#191919;--sub:#5F5F5F;--mute:#9A9A9A;
  --bg:#F5F6F8;--card:#FFFFFF;--line:#EBEBEB;--line2:#DDDDDD;--bubble:#F1F2F4;--star:#FFB400;
  --meat:#E0533A;--rice:#2F8F5B;--noodle:#3A7BD5;--cafe:#C58A2A;--bar:#8452B6;--etc:#7D8590;--home:#3C1E1E;
  --sheet-w:420px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",-apple-system,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.5;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
a{color:inherit}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#D0D0D0;border-radius:6px}

/* ===== header ===== */
.hd{background:var(--kakao);padding:10px 14px;display:flex;align-items:center;gap:10px;position:relative;z-index:5}
.logo{width:36px;height:36px;border-radius:11px;background:var(--brown);display:grid;place-items:center;flex:none}
.logo svg{width:22px;height:22px}
.hd h1{font-size:17px;margin:0;font-weight:800;color:var(--brown);letter-spacing:-.02em;line-height:1.15}
.hd .sub{font-size:11.5px;color:#6B5A2E;font-weight:500}
.hd .sp{flex:1}
.ic{width:38px;height:38px;border:none;border-radius:50%;background:rgba(60,30,30,.08);display:grid;place-items:center;color:var(--brown)}
.ic:hover{background:rgba(60,30,30,.15)}
.ic svg{width:20px;height:20px}
.status{font-size:11px;color:#6B5A2E;display:flex;align-items:center;gap:5px;margin-right:4px}
.status i{width:7px;height:7px;border-radius:50%;background:#2FB35E}
.status.demo i{background:#E0533A}

/* search + chips */
.tools{background:#fff;border-bottom:1px solid var(--line);padding:10px 14px 0}
.search{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:12px;padding:0 12px;height:42px}
.search svg{width:18px;height:18px;color:var(--mute);flex:none}
.search input{flex:1;border:none;background:transparent;outline:none;font-size:15px;min-width:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line2);background:#fff;border-radius:99px;padding:6px 12px;font-size:13.5px;font-weight:600;color:var(--sub);display:flex;align-items:center;gap:5px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip .em{font-size:14px}

/* ===== layout ===== */
.main{flex:1;display:grid;grid-template-columns:var(--sheet-w) 1fr;min-height:0;position:relative}
.list{overflow-y:auto;background:var(--bg);border-right:1px solid var(--line)}
.lhead{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 8px;font-size:13px;color:var(--sub)}
.lhead b{color:var(--ink)}
.lhead select{border:none;background:transparent;font-size:13px;font-weight:600;color:var(--ink);padding:4px 0}
#map{height:100%;min-height:280px;z-index:1}

/* ===== card ===== */
.card{background:var(--card);margin:0 12px 10px;border-radius:16px;padding:14px;cursor:pointer;border:1.5px solid transparent;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card.active{border-color:var(--ink)}
.card .top{display:flex;gap:12px}
.card .ico{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:26px;flex:none;background:var(--bubble);overflow:hidden}
.card .ico img{width:100%;height:100%;object-fit:cover}
.card h3{margin:0;font-size:16px;font-weight:800;letter-spacing:-.01em;display:flex;gap:6px;align-items:center}
.card .cat{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;color:#fff}
.card .menu{color:var(--sub);font-size:13.5px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rate{display:flex;align-items:center;gap:6px;font-size:13px;margin-top:4px}
.rate .s{color:var(--star);font-weight:800}
.rate .n{color:var(--mute)}
.card .meta{display:flex;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--mute);margin-top:8px}
.card .meta span::before{content:"·";margin-right:8px;color:#CFCFCF}
.card .meta span:first-child::before{content:none}
.card .memo{margin-top:8px;font-size:13px;color:var(--sub);background:var(--bubble);padding:7px 10px;border-radius:0 12px 12px 12px;display:inline-block;max-width:100%}
.empty{padding:50px 20px;text-align:center;color:var(--mute);font-size:14px}
.empty .em{font-size:40px;margin-bottom:8px}

/* ===== detail sheet ===== */
.detail{position:absolute;top:0;left:0;width:var(--sheet-w);height:100%;background:#fff;z-index:6;transform:translateX(-102%);transition:transform .22s ease;overflow-y:auto;box-shadow:4px 0 24px rgba(0,0,0,.08)}
.detail.open{transform:none}
.dhead{position:sticky;top:0;background:#fff;display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);z-index:2}
.dhead b{flex:1;text-align:center;font-size:15px}
.hero{padding:18px 18px 10px;display:flex;gap:14px;align-items:center}
.hero .ico{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:32px;background:var(--bubble);flex:none;overflow:hidden}
.hero .ico img{width:100%;height:100%;object-fit:cover}
.hero h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em}
.hero .menu{color:var(--sub);font-size:14px}
.bigrate{display:flex;align-items:baseline;gap:8px;padding:0 18px 12px}
.bigrate .avg{font-size:34px;font-weight:800;line-height:1}
.bigrate .stars{color:var(--star);font-size:18px;letter-spacing:1px}
.bigrate .cnt{color:var(--mute);font-size:13px}
.bars{padding:0 18px 14px;display:grid;gap:4px}
.bar{display:grid;grid-template-columns:22px 1fr 28px;gap:8px;align-items:center;font-size:12px;color:var(--sub)}
.bar .tr{height:7px;background:var(--bubble);border-radius:6px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--star)}
.qa{display:flex;gap:8px;padding:0 18px 14px}
.qa a,.qa button{flex:1;border:1px solid var(--line2);background:#fff;border-radius:12px;padding:10px 6px;font-size:13px;font-weight:700;text-decoration:none;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink)}
.qa svg{width:18px;height:18px}
.info{padding:0 18px 14px;display:grid;gap:8px;font-size:14px}
.info div{display:flex;gap:10px}
.info svg{width:18px;height:18px;color:var(--mute);flex:none;margin-top:3px}
.sect{padding:14px 18px 6px;font-size:14px;font-weight:800;display:flex;justify-content:space-between;align-items:center;border-top:8px solid var(--bg)}
.sect small{font-weight:500;color:var(--mute)}
.rv{padding:8px 18px;display:flex;gap:10px}
.rv .av{width:36px;height:36px;border-radius:50%;background:var(--kakao);color:var(--brown);font-weight:800;display:grid;place-items:center;flex:none;font-size:14px}
.rv .bd{flex:1;min-width:0}
.rv .nm{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.rv .nm .st{color:var(--star);font-size:12px}
.rv .nm time{color:var(--mute);font-weight:400;font-size:11.5px;margin-left:auto}
.rv .bb{background:var(--bubble);padding:8px 12px;border-radius:0 14px 14px 14px;font-size:14px;margin-top:4px;display:inline-block;max-width:100%;word-break:break-word}
.rv .del{border:none;background:none;color:var(--mute);font-size:11px;padding:0;margin-top:4px}
.write{padding:14px 18px 30px;border-top:8px solid var(--bg)}
.write h4{margin:0 0 8px;font-size:14px}
.starpick{display:flex;gap:2px;margin-bottom:8px}
.starpick button{border:none;background:none;font-size:32px;color:#DADADA;padding:0 2px;line-height:1}
.starpick button.on{color:var(--star)}
.starpick .lab{align-self:center;margin-left:8px;font-size:13px;color:var(--sub);font-weight:600}
.write textarea,.write input{width:100%;border:1px solid var(--line2);border-radius:12px;padding:10px 12px;background:#fff;margin-bottom:8px;resize:vertical}
.write textarea:focus,.write input:focus{outline:2px solid var(--ink);outline-offset:-1px}
.btn{border:none;border-radius:12px;padding:12px 16px;font-weight:800;font-size:15px}
.btn.k{background:var(--kakao);color:var(--brown);width:100%}
.btn.k:hover{background:var(--kakao-dk)}
.btn.dark{background:var(--ink);color:#fff}
.btn.line{background:#fff;color:var(--ink);border:1px solid var(--line2)}
.btn.danger{background:#fff;color:var(--meat);border:1px solid #F6CFC6;margin-right:auto}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5}
.btn:focus-visible{outline:2px solid var(--brown);outline-offset:2px}

/* ===== modal (register/edit) ===== */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:1000}
.modal.open{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;max-height:94vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:6px 18px 30px}
.grab{width:40px;height:4px;border-radius:4px;background:#DDD;margin:6px auto 12px}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:20px}.grab{display:none}}
.sheet h2{margin:6px 0 4px;font-size:19px}
.hint{font-size:13px;color:var(--mute);margin-bottom:12px}
.f{display:grid;gap:10px}
.f label{display:grid;gap:5px;font-size:13px;color:var(--sub);font-weight:700}
.f input,.f select,.f textarea{border:1px solid var(--line2);border-radius:12px;padding:11px 12px;background:#fff;font-weight:400}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--ink);outline-offset:-1px}
.f .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.catgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.catgrid button{border:1px solid var(--line2);background:#fff;border-radius:12px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--sub)}
.catgrid button .em{font-size:22px}
.catgrid button.on{border-color:var(--ink);background:#FFFBE0;color:var(--ink)}
.geo{display:flex;gap:8px}.geo input{flex:1}
#pickmap{height:200px;border-radius:12px;border:1px solid var(--line2)}
.err{color:var(--meat);font-size:13px;min-height:18px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}

/* toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(25,25,25,.92);color:#fff;padding:11px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:2000}
.toast.show{opacity:1}

/* popup */
.leaflet-popup-content-wrapper{border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.15)}
.leaflet-popup-content{margin:10px 14px;font-size:13px;line-height:1.45;min-width:170px}
.leaflet-popup-content b{font-size:14px}
.leaflet-popup-content .go{display:inline-block;margin-top:6px;background:var(--kakao);color:var(--brown);padding:5px 10px;border-radius:8px;font-weight:800;cursor:pointer}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);display:grid;place-items:center}
.pin span{transform:rotate(45deg);font-size:15px;line-height:1}
.pin.home{border-radius:8px;transform:none}
.pin.home span{transform:none}

/* ===== mobile ===== */
.tab{display:none}
@media(max-width:760px){
  :root{--sheet-w:100%}
  .hd h1{font-size:16px}.hd .sub{display:none}
  .main{grid-template-columns:1fr;grid-template-rows:1fr;padding-bottom:58px}
  .list{position:absolute;inset:0;bottom:58px;display:none;border:none}
  body.v-list .list{display:block}
  body.v-list #map{visibility:hidden}
  .detail{width:100%;bottom:0}
  .tab{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;position:fixed;left:0;right:0;bottom:0;height:58px;background:#fff;border-top:1px solid var(--line);z-index:900;padding-bottom:env(safe-area-inset-bottom)}
  .tab button{border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--mute);font-weight:600}
  .tab button.on{color:var(--ink)}
  .tab svg{width:22px;height:22px}
  .tab .add{color:var(--brown)}
  .tab .add .circ{width:34px;height:34px;border-radius:50%;background:var(--kakao);display:grid;place-items:center}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="hd">
  <div class="logo"><svg viewBox="0 0 64 64"><path d="M32 8c-11 0-20 8.4-20 18.8 0 6.5 3.5 12.2 8.8 15.6L18 54l12.4-7.5c.5 0 1.1.1 1.6.1 11 0 20-8.4 20-18.8S43 8 32 8z" fill="#FEE500"/><path d="M32 18l3 6.5 7.1.9-5.2 5 1.3 7.1L32 34l-6.2 3.5 1.3-7.1-5.2-5 7.1-.9z" fill="#3C1E1E"/></svg></div>
  <div><h1>강원랜드 프로젝트 맛집 지도</h1><div class="sub">인재개발센터 기준 · 우리끼리 평가하는 진짜 맛집</div></div>
  <div class="sp"></div>
  <span class="status" id="status"><i></i>연결 중</span>
  <button class="ic" id="refresh" title="새로고침" aria-label="새로고침"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg></button>
  <button class="ic" id="add" title="맛집 등록" aria-label="맛집 등록"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
</header>

<div class="tools">
  <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="search" id="q" placeholder="식당, 메뉴, 한줄평 검색"></div>
  <div class="chips" id="chips"></div>
</div>

<div class="main">
  <div class="list">
    <div class="lhead"><span><b id="count">0</b>곳</span>
      <select id="sort"><option value="dist">가까운 순</option><option value="rating">별점 높은 순</option><option value="reviews">평가 많은 순</option><option value="new">최근 등록 순</option></select></div>
    <div id="cards"></div>
  </div>
  <div id="map"></div>

  <!-- detail -->
  <aside class="detail" id="detail" aria-label="상세"></aside>
</div>

<nav class="tab">
  <button id="t-map" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s7-6.4 7-12a7 7 0 0 0-14 0c0 5.6 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>지도</button>
  <button id="t-list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>목록</button>
  <button id="t-add" class="add"><span class="circ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>등록</button>
  <button id="t-top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.8 6.1 21l1.2-6.5L2.5 9.9l6.6-.9z"/></svg>TOP</button>
</nav>

<!-- register / edit -->
<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="sheet">
    <div class="grab"></div>
    <h2 id="mtitle">맛집 등록</h2>
    <div class="hint">주소를 검색하면 핀이 찍히고, 지도를 눌러 위치를 조정할 수 있어요. 별점은 등록 후 상세 화면에서 남겨요.</div>
    <div class="f">
      <label>이름 *<input id="f_name" placeholder="예: 함백산실비식당"></label>
      <label>종류 *<div class="catgrid" id="f_cat"></div></label>
      <label>대표 메뉴<input id="f_menu" placeholder="예: 와규·안창살"></label>
      <label>주소<div class="geo"><input id="f_addr" placeholder="도로명 또는 지번"><button class="btn line sm" id="geocode" type="button">검색</button></div></label>
      <div id="pickmap"></div>
      <div class="two"><label>위도<input id="f_lat" inputmode="decimal"></label><label>경도<input id="f_lng" inputmode="decimal"></label></div>
      <div class="two"><label>영업시간<input id="f_hours" placeholder="11:00–22:00, 월 휴무"></label><label>전화<input id="f_phone" placeholder="033-000-0000"></label></div>
      <label>사진 URL<input id="f_img" placeholder="https://… (선택)"></label>
      <label>한줄 메모<textarea id="f_memo" rows="2" placeholder="예약 필수, 주차 2대, 곤드레밥 추천…"></textarea></label>
      <label>등록자<input id="f_author" placeholder="이름 또는 닉네임"></label>
      <div class="err" id="ferr"></div>
      <div class="actions">
        <button class="btn danger sm" id="del" type="button" style="display:none">삭제</button>
        <button class="btn line" id="cancel" type="button">취소</button>
        <button class="btn dark" id="save" type="button">저장</button>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ===== 설정: Supabase 값을 넣으세요 (비우면 데모 모드) ===== */
const SUPABASE_URL  = "sb_publishable_OEnp8Wv8WQD9nm162iVBaw_MOcqnIVo";
const SUPABASE_ANON = "sb_publishable_OEnp8Wv8WQD9nm162iVBaw_MOcqnIVo";
const HOME = {name:"강원랜드 인재개발센터", lat:37.2002, lng:128.8555};
/* ============================================================ */

const demo=!SUPABASE_URL||!SUPABASE_ANON;
let places=[],reviews=[];
const H={"apikey":SUPABASE_ANON,"Authorization":"Bearer "+SUPABASE_ANON,"Content-Type":"application/json","Prefer":"return=representation"};
const api=(path,opt={})=>fetch(`${SUPABASE_URL}/rest/v1/${path}`,{...opt,headers:{...H,...(opt.headers||{})}}).then(async r=>{if(!r.ok)throw new Error(await r.text());return r.status===204?null:r.json();});
const DB=demo?{
  async load(){if(!places.length){places=SEED_P.slice();reviews=SEED_R.slice();}},
  async insert(p){p.id="l"+Date.now();p.created_at=new Date().toISOString();places.unshift(p);return p;},
  async update(id,p){Object.assign(places.find(x=>x.id===id),p);},
  async remove(id){places=places.filter(x=>x.id!==id);reviews=reviews.filter(r=>r.place_id!==id);},
  async review(r){r.id="rv"+Date.now();r.created_at=new Date().toISOString();reviews.unshift(r);return r;},
  async unreview(id){reviews=reviews.filter(r=>r.id!==id);}
}:{
  async load(){[places,reviews]=await Promise.all([api("places?select=*&order=created_at.desc"),api("reviews?select=*&order=created_at.desc")]);},
  async insert(p){const row=(await api("places",{method:"POST",body:JSON.stringify(p)}))[0];places.unshift(row);return row;},
  async update(id,p){await api(`places?id=eq.${id}`,{method:"PATCH",body:JSON.stringify(p)});Object.assign(places.find(x=>x.id===id),p);},
  async remove(id){await api(`places?id=eq.${id}`,{method:"DELETE"});places=places.filter(x=>x.id!==id);reviews=reviews.filter(r=>r.place_id!==id);},
  async review(r){const row=(await api("reviews",{method:"POST",body:JSON.stringify(r)}))[0];reviews.unshift(row);return row;},
  async unreview(id){await api(`reviews?id=eq.${id}`,{method:"DELETE"});reviews=reviews.filter(r=>r.id!==id);}
};

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dist=(a,b)=>{const R=6371,dLat=(b.lat-a.lat)*Math.PI/180,dLng=(b.lng-a.lng)*Math.PI/180,x=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(x));};
const fmtDist=k=>k<1?`${Math.round(k*1000)}m · 도보 ${Math.max(1,Math.round(k*1000/75))}분`:`${k.toFixed(1)}km · 차 ${Math.max(2,Math.round(k*2.2))}분`;
const stat=id=>{const rs=reviews.filter(r=>r.place_id===id);const n=rs.length;const avg=n?rs.reduce((s,r)=>s+r.rating,0)/n:0;return{n,avg,rs};};
const starStr=v=>{const f=Math.round(v);return "★".repeat(f)+"☆".repeat(5-f);};
const ago=t=>{const d=(Date.now()-new Date(t))/6e4;if(d<60)return Math.max(1,Math.round(d))+"분 전";if(d<1440)return Math.round(d/60)+"시간 전";if(d<43200)return Math.round(d/1440)+"일 전";return new Date(t).toLocaleDateString("ko-KR");};

let filter="all",query="",sort="dist",activeId=null;
function visible(){
  const q=query.trim().toLowerCase();
  const arr=places.filter(p=>{
    if(filter!=="all"&&p.category!==filter)return false;
    if(!q)return true;
    const rvtxt=reviews.filter(r=>r.place_id===p.id).map(r=>r.comment).join(" ");
    return [p.name,p.menu,p.memo,p.address,rvtxt].join(" ").toLowerCase().includes(q);
  });
  arr.forEach(p=>{p._d=dist(HOME,p);const s=stat(p.id);p._n=s.n;p._avg=s.avg;});
  const by={dist:(a,b)=>a._d-b._d,rating:(a,b)=>b._avg-a._avg||b._n-a._n||a._d-b._d,reviews:(a,b)=>b._n-a._n||b._avg-a._avg,new:(a,b)=>new Date(b.created_at)-new Date(a.created_at)};
  return arr.sort(by[sort]);
}
function render(){
  const arr=visible();

      </div>

    ${p.memo?`<div class="memo">${esc(p.memo)}</div>`:""}

  cluster.clearLayers();
  arr.forEach(p=>{
    const m=L.marker([p.lat,p.lng],{icon:pin(p.category)});
    m.bindPopup(`<b>${esc(p.name)}</b> ${p._n?`<span style="color:#FFB400;font-weight:800">★ ${p._avg.toFixed(1)}</span>`:""}<br>${esc(p.menu||"")}<br><span style="color:#9A9A9A">${fmtDist(p._d)}</span><br><span class="go" data-open="${p.id}">상세 · 평가하기</span>`);

  });

}

$("f_cat").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;fcat=b.dataset.c;paintCat();});
function paintCat(){$("f_cat").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.c===fcat));}
function setPin(lat,lng){$("f_lat").value=lat.toFixed(6);$("f_lng").value=lng.toFixed(6);if(pickMarker)pickMarker.setLatLng([lat,lng]);else pickMarker=L.marker([lat,lng],{draggable:true,icon:pin(fcat)}).addTo(pickMap).on("dragend",e=>{const q=e.target.getLatLng();setPin(q.lat,q.lng);});pickMap.setView([lat,lng],Math.max(pickMap.getZoom(),15));}
function openForm(p){
  editing=p||null;fcat=p?.category||"meat";paintCat();
  $("mtitle").textContent=p?"맛집 수정":"맛집 등록";$("del").style.display=p?"":"none";$("ferr").textContent="";
  ["name","menu","addr","hours","phone","img","memo","author","lat","lng"].forEach(k=>$("f_"+k).value="");
  if(p){$("f_name").value=p.name;$("f_menu").value=p.menu||"";$("f_addr").value=p.address||"";$("f_hours").value=p.hours||"";$("f_phone").value=p.phone||"";$("f_img").value=p.image_url||"";$("f_memo").value=p.memo||"";$("f_author").value=p.author||"";}
  else $("f_author").value=me;
  modal.classList.add("open");
  setTimeout(()=>{
    if(!pickMap){pickMap=L.map("pickmap",{zoomControl:false}).setView([HOME.lat,HOME.lng],14);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19}).addTo(pickMap);pickMap.on("click",e=>setPin(e.latlng.lat,e.latlng.lng));}
    pickMap.invalidateSize();if(pickMarker){pickMap.removeLayer(pickMarker);pickMarker=null;}
    p?setPin(p.lat,p.lng):pickMap.setView(map.getCenter(),15);
  },60);
}
$("add").onclick=$("t-add").onclick=()=>openForm();
$("cancel").onclick=()=>modal.classList.remove("open");
modal.addEventListener("click",e=>{if(e.target===modal)modal.classList.remove("open");});
$("geocode").onclick=async()=>{
  const q=$("f_addr").value.trim();if(!q)return;$("geocode").textContent="…";
  try{const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=kr&q=${encodeURIComponent(/정선|강원/.test(q)?q:"정선군 "+q)}`,{headers:{"Accept-Language":"ko"}});const j=await r.json();j[0]?setPin(+j[0].lat,+j[0].lon):$("ferr").textContent="주소를 찾지 못했어요. 지도를 눌러 위치를 찍어주세요.";}
  catch{$("ferr").textContent="주소 검색 실패. 지도를 눌러 위치를 찍어주세요.";}
  $("geocode").textContent="검색";
};
$("save").onclick=async()=>{
  const p={name:$("f_name").value.trim(),category:fcat,menu:$("f_menu").value.trim(),address:$("f_addr").value.trim(),hours:$("f_hours").value.trim(),phone:$("f_phone").value.trim(),image_url:$("f_img").value.trim(),memo:$("f_memo").value.trim(),author:$("f_author").value.trim(),lat:parseFloat($("f_lat").value),lng:parseFloat($("f_lng").value)};
  if(!p.name){$("ferr").textContent="이름을 입력해주세요.";return;}
  if(isNaN(p.lat)||isNaN(p.lng)){$("ferr").textContent="위치를 지정해주세요 (주소 검색 또는 지도 클릭).";return;}
  me=p.author||me;$("save").disabled=true;
  try{
    if(editing){await DB.update(editing.id,p);toast("수정했어요");modal.classList.remove("open");render();renderDetail(editing.id);}
    else{const row=await DB.insert(p);toast("등록했어요");modal.classList.remove("open");activeId=row.id;render();openDetail(row.id);}
  }catch(err){$("ferr").textContent="저장 실패: "+err.message.slice(0,80);}
  $("save").disabled=false;
};
$("del").onclick=async()=>{if(!editing||!confirm(`"${editing.name}"을(를) 삭제할까요? 한줄평도 함께 지워져요.`))return;try{await DB.remove(editing.id);modal.classList.remove("open");closeDetail();render();toast("삭제했어요");}catch(err){$("ferr").textContent="삭제 실패: "+err.message.slice(0,80);}};

/* ---------- mobile tabs ---------- */
const setTab=id=>{["t-map","t-list","t-top"].forEach(k=>$(k).classList.toggle("on",k===id));};
$("t-map").onclick=()=>{document.body.classList.remove("v-list");closeDetail();setTab("t-map");setTimeout(()=>map.invalidateSize(),50);};
$("t-list").onclick=()=>{document.body.classList.add("v-list");closeDetail();setTab("t-list");};
$("t-top").onclick=()=>{sort="rating";$("sort").value="rating";document.body.classList.add("v-list");closeDetail();setTab("t-top");render();};

/* ---------- load ---------- */
async function load(){
  const s=$("status");
  try{await DB.load();s.className="status"+(demo?" demo":"");s.innerHTML=`<i></i>${demo?"데모 모드":"공유 중"}`;render();
    const hash=location.hash.slice(1);if(hash&&places.find(p=>p.id===hash)){activeId=hash;openDetail(hash);}
  }catch(err){s.className="status demo";s.innerHTML="<i></i>연결 실패";toast("DB 연결 실패: "+err.message.slice(0,60));}
}
load();
</script>
</body>
</html>
