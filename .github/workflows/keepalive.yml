# Supabase free projects pause after a period of inactivity.
# This pings the database every 3 days so the food map keeps working.
name: supabase-keepalive
on:
  schedule:
    - cron: "17 0 */3 * *"   # every 3 days, 00:17 UTC (09:17 KST)
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        env:
          URL: https://jcwqolnyzrbosuqlqfjh.supabase.co/rest/v1/places?select=id&limit=1
          KEY: sb_publishable_OEnp8Wv8WQD9nm162iVBaw_MOcqnIVo   # public key, already in index.html
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" "$URL")
          echo "status=$code"
          test "$code" = "200"
